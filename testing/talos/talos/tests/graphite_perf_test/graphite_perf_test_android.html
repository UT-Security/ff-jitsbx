<!DOCTYPE html>
<html style="width: 100%; height: 100%;" >
<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>Expat test</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <link rel='stylesheet' type='text/css' media='screen' href='main.css'>
    <script type="text/javascript">

        var timeout = 8000;
        function setSvg(i) {
            if (i > 0) {
                i = i - 1;
                document.getElementById("loc").innerHTML = '<iframe style="width: 100%; height: 100%;" src="index.html" />'
                setTimeout(function(){ clearSvg(i); }, timeout);
            }
        }

        function clearSvg(i) {
            document.getElementById("loc").innerHTML = ''
            setTimeout(function(){ setSvg(i); }, timeout);
        }

        function dotest() {
            setSvg(110);
        }

        setTimeout(dotest, 5000);
    </script>
</head>
<body style="width: 100%; height: 100%;" >
    <div style="width: 100%; height: 100%;" id="loc">
        <div>Starting test in 5 seconds</div>
    </div>
</body>
</html>
